<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythmove Test</title>
    <style>
        /* Remove default margins and hide scrollbars on the main window */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        /* Make the iframe span the entire viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block; /* Removes inline bottom whitespace */
        }
    </style>
</head>
<body>

    <iframe src="page/rhythmove.html"></iframe>
    <script type="module">
        import { DiscordSDK } from "./discord-sdk.js";

        const discordSdk = new DiscordSDK("1568863112751222905");

        await discordSdk.ready();
        document.getElementById("status").textContent =
        `Connected! Channel: ${discordSdk.channelId}, instance: ${discordSdk.instanceId}`;
    </script>
</body>
</html>
